# 信源配置：控制启用哪些源、抓取参数等。修改此文件无需改代码。
# 所有信源均为官方 API 或官方 RSS，合法合规。
#
# kind 字段决定该源进入哪个区：
#   demand    = 需求候选，会经过 LLM 智能研判，进入"今日真实需求机会"区
#   reference = 趋势/灵感参考（新品发布、榜单、资讯），单独成区，不冒充需求

# 每个市场最终展示的"真实需求机会"条数
top_n_overseas: 12
top_n_domestic: 8
# "趋势/灵感参考"区每个市场展示条数
top_n_reference: 6

# 抓取窗口：只保留最近 N 小时内的内容
recent_hours: 72

collectors:
  # ---------------- 海外 ----------------
  hackernews:
    enabled: true
    market: overseas
    kind: demand
    # HN Algolia 官方 Search API。抓取关键词命中的 story/ask
    queries:
      - "is there a tool"
      - "i wish there was"
      - "looking for an app"
      - "recommend a tool"
      - "how do i automate"
      - "anyone know a tool"
      - "tired of doing"
    hits_per_query: 25
    min_points: 2

  reddit:
    enabled: true
    market: overseas
    kind: demand
    subreddits:
      - SaaS
      - SomebodyMakeThis
      - Entrepreneur
      - sideproject
      - microsaas
      - Business_Ideas
    listing: top
    time_filter: day
    limit_per_sub: 15

  producthunt:
    enabled: true
    market: overseas
    kind: reference        # 新品发布 -> 灵感/竞品参考
    limit: 20

  rss_overseas:
    enabled: true
    market: overseas
    feeds:
      - name: Indie Hackers
        url: https://www.indiehackers.com/feed.xml
        kind: demand        # IH 帖子常含真实需求/经验
      - name: Hacker News Show
        url: https://hnrss.org/show
        kind: reference     # Show HN 是发布 -> 参考

  # ---------------- 国内 ----------------
  v2ex:
    enabled: true
    market: domestic
    kind: demand
    nodes:
      - create
      - ideas
      - apple
    limit_per_node: 15

  appstore:
    enabled: true
    market: domestic
    kind: reference        # 榜单 -> 市场/趋势参考
    country: cn
    feed: topfreeapplications
    limit: 20

  rss_domestic:
    enabled: true
    market: domestic
    feeds:
      - name: 少数派
        url: https://sspai.com/feed
        kind: reference
      - name: 36氪
        url: https://www.36kr.com/feed
        kind: reference
